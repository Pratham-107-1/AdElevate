spring.application.name=backend

#DB config
spring.datasource.url=jdbc:mysql://localhost:3306/adelevate?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
#default server port 8080
server.port=9090
# Vendor ad-image uploads (native file picker on the frontend) go through
# POST /api/ad-images/upload — bump the default 1MB limit so real photos work.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.security.user.name=admin
spring.security.user.password=admin


